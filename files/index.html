<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Files</title>
</head>
<body>

<h1>Files</h1>

<ul id="list">Loading…</ul>

<script>
  const OWNER = "nafizx";
  const REPO = "portfolioo";
  const BRANCH = "main";
  const PATH = "files"; // this folder's path inside the repo

  fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`)
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      const list = document.getElementById("list");

      if (!ok || !Array.isArray(data)) {
        const msg = (data && data.message) ? data.message : "Unknown error";
        list.textContent = `GitHub API error: ${msg}`;
        return;
      }

      const skip = ["index.html"];
      const files = data.filter(f => f.type === "file" && !skip.includes(f.name));

      if (files.length === 0) {
        list.textContent = "No files yet.";
        return;
      }
      list.innerHTML = files
        .map(f => `<li><a href="${encodeURIComponent(f.name)}" download="${f.name}">${f.name}</a></li>`)
        .join("");
    })
    .catch(err => {
      document.getElementById("list").textContent = "Couldn't load file list.";
      console.error(err);
    });
</script>

</body>
</html>
