<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Files</title>
</head>
<body>

<h1>Files</h1>

<ul id="list">Loading…</ul>

<script>
  
  const OWNER = "nafizx";
  const REPO = "portfolioo";
  const BRANCH = "main";

  const PATH = "files"; 

  fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`)
    .then(r => r.json())
    .then(data => {
      const skip = ["index.html"];
      const files = (Array.isArray(data) ? data : [])
        .filter(f => f.type === "file" && !skip.includes(f.name));

      const list = document.getElementById("list");
      if (files.length === 0) {
        list.textContent = "No files yet.";
        return;
      }
      list.innerHTML = files
        .map(f => `<li><a href="${encodeURIComponent(f.name)}" download="${f.name}">${f.name}</a></li>`)
        .join("");
    })
    .catch(err => {
      document.getElementById("list").textContent = "Couldn't load file list.";
      console.error(err);
    });
</script>

</body>
</html>
