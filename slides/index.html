<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download the Slides</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <div class="card">
    <p class="eyebrow">Presentation</p>

    <!-- EDIT THESE TWO LINES to match your file -->
    <h1 id="deck-title">Slide Deck</h1>
    <p class="subtitle" id="deck-subtitle">A short description of what this deck covers.</p>

    <div class="file-row">
      <div class="file-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <rect x="6" y="3" width="30" height="42" rx="2" fill="#F6F2E8" stroke="#B8934D" stroke-width="1.5"/>
          <path d="M28 3v9a2 2 0 0 0 2 2h9" fill="none" stroke="#B8934D" stroke-width="1.5"/>
          <rect x="12" y="20" width="18" height="13" rx="1.5" fill="#9C3B2E"/>
          <rect x="14.5" y="22.5" width="13" height="8" rx="0.8" fill="#F6F2E8"/>
        </svg>
      </div>
      <div class="file-meta">
        <p class="file-name" id="file-name">slides.pptx</p>
        <p class="file-size" id="file-size">PowerPoint file</p>
      </div>
    </div>

    <a class="download-btn" id="download-btn" href="slides.pptx" download>
      Download the deck <span aria-hidden="true">↓</span>
    </a>

    <p class="fallback-note">
      Nothing happen? <a id="fallback-link" href="slides.pptx">Open the file directly</a> instead.
    </p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
