<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Context Clues Flashcards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f0;--ink:#1d2b2a;--front:#fff;--back:#1f5c52;--backink:#f2fbf8;--mut:#5c6f6c;--acc:#c8472b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a19;--ink:#e6f0ee;--front:#1a2a28;--back:#2f8a7a;--backink:#06201b;--mut:#8aa19d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bar button{font:inherit;font-size:.85rem;border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:20px;padding:6px 12px}
.bar button.on{background:var(--ink);color:var(--bg)}
h2{font-size:1rem;margin:22px 0 10px;color:var(--mut);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{perspective:800px;height:270px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.f{background:var(--front);font-size:1.25rem;font-weight:bold;border:1.5px solid var(--ink)}
.b{background:var(--back);color:var(--backink);transform:rotateY(180deg);font-size:.88rem;line-height:1.35;justify-content:flex-start;align-items:flex-start;text-align:left}.b p{margin:0 0 6px}.b mark{background:#ffe27a;color:#222;padding:0 2px;border-radius:3px}
.b b{display:block;font-size:1rem;margin-bottom:5px}
.b i{display:block;margin-top:5px;opacity:.9}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style></head><body>
<h1>Context Clues Flashcards</h1>
<p class="sub">Tap a word to see the sentence, definition and clue.</p>
<div class="bar" id="bar"></div>
<div id="app"></div>
<script>

const app=document.getElementById('app'),bar=document.getElementById('bar');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(only){
app.innerHTML='';
S.forEach(([n,w],i)=>{if(only!==null&&only!==i)return;
const h=document.createElement('h2');h.textContent=n+' ('+w.length+' words)';app.appendChild(h);
const g=document.createElement('div');g.className='grid';
w.forEach(([a,d,c],j)=>{const s=esc(SEN[i][j]).replace(/\{([^}]+)\}/,'<mark>$1</mark>');const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',a+', tap to flip');
b.innerHTML='<div class="in"><div class="f">'+esc(a)+'</div><div class="b"><b>'+esc(a)+'</b><p>'+s+'</p><p><strong>Definition:</strong> '+esc(d)+'</p><i>Clue: '+esc(c)+'</i></div></div>';
b.onclick=()=>b.classList.toggle('flip');g.appendChild(b)});
app.appendChild(g)})}
[['All',null],...S.map((s,i)=>[s[0],i])].forEach(([t,v],k)=>{const b=document.createElement('button');b.textContent=t;
if(k===0)b.className='on';b.onclick=()=>{[...bar.children].forEach(x=>x.className='');b.className='on';render(v)};bar.appendChild(b)});
render(null);
